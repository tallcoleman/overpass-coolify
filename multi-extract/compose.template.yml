# Overpass API over several adjacent OpenStreetMap France regions, kept current
# by a sidecar that merges the regions' minute diffs into one stream (osmium +
# supercronic). Design: DESIGN.md. Written for Coolify's paste-a-compose deploy.
#
# Configuration (Coolify environment variables, or .env locally):
#   OSM_EXTRACT_URLS             (required) whitespace-separated extract URLs, e.g. .../<region>-latest.osm.pbf
#   OSM_DIFF_URLS                (required) the matching .../<region>/minute replication folders, same order (a trailing / is fine)
#   POLL_INTERVAL_MINUTES        5    sidecar tick; each region's state.txt is fetched once per tick
#   OVERPASS_CLEANUP_KEEP_HOURS  72   retention of merged diffs (sidecar) and fetched diffs (overpass)
#   SNAPSHOT_KEEP_HOURS          72   how long the bootstrap snapshot is kept for a fast re-import
#   MERGE_LAG_ALERT_MINUTES      30   sidecar turns unhealthy when the merged head is older than this
#   SIDECAR_MEM_LIMIT            1g   sidecar memory limit (raise for many or country-sized regions)
#   OVERPASS_IMAGE               b1tw153/overpass-api:0.7.62.11-r21
# Changing either region list takes effect on the next restart of the stack and
# rebuilds the merged stream, the snapshot and the database.
#
# The merged stream is public at https://<domain>/replication/ (status.txt there
# shows the merge and Overpass lag, region heads and error flags).

x-overpass-image: &overpass-image "${OVERPASS_IMAGE:-b1tw153/overpass-api:0.7.62.11-r21}"

x-regions: &regions
  OSM_EXTRACT_URLS: "${OSM_EXTRACT_URLS:?set OSM_EXTRACT_URLS to the region extract URLs}"
  OSM_DIFF_URLS: "${OSM_DIFF_URLS:?set OSM_DIFF_URLS to the region minute replication URLs}"

volumes:
  overpass-db: null
  # Diffs fetched by overpass, plus fetch_osc.log/.out, kept across redeploys.
  overpass-diff: null
  # Sidecar scratch: extracts, raw diffs, the bootstrap snapshot, supercronic.
  # Nothing here is needed to resume the merged stream.
  sidecar-work: null
  # The merged minute stream, served by overpass's nginx at /replication/.
  merged-replication: null

# The scripts, inlined by build.sh from sidecar/ (with $ escaped as $$).
configs:
  lib:
    content: |
      @@INCLUDE sidecar/lib.sh@@
  entrypoint:
    content: |
      @@INCLUDE sidecar/entrypoint.sh@@
  bootstrap:
    content: |
      @@INCLUDE sidecar/bootstrap.sh@@
  catch-up:
    content: |
      @@INCLUDE sidecar/catch-up.sh@@
  health:
    content: |
      @@INCLUDE sidecar/health.sh@@
  tiebreak:
    content: |
      @@INCLUDE sidecar/tiebreak.pl@@
  init:
    content: |
      @@INCLUDE sidecar/init.sh@@

services:
  sidecar:
    image: *overpass-image
    container_name: overpass-sidecar
    restart: unless-stopped
    # Root only to chown the volume roots; entrypoint.sh drops to uid 10001.
    user: "0"
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    # supercronic waits for a running job on SIGTERM; a normal catch-up run
    # takes seconds, and a killed one loses at most the minute it was merging.
    stop_grace_period: 60s
    mem_limit: "${SIDECAR_MEM_LIMIT:-1g}"
    memswap_limit: "${SIDECAR_MEM_LIMIT:-1g}"
    configs:
      - { source: lib, target: /scripts/lib.sh }
      - { source: entrypoint, target: /scripts/entrypoint.sh }
      - { source: bootstrap, target: /scripts/bootstrap.sh }
      - { source: catch-up, target: /scripts/catch-up.sh }
      - { source: health, target: /scripts/health.sh }
      - { source: tiebreak, target: /scripts/tiebreak.pl }
    volumes:
      - "sidecar-work:/work"
      - "merged-replication:/replication"
      - "overpass-db:/opt/overpass/db:ro"
    environment:
      <<: *regions
      POLL_INTERVAL_MINUTES: "${POLL_INTERVAL_MINUTES:-5}"
      OVERPASS_CLEANUP_KEEP_HOURS: "${OVERPASS_CLEANUP_KEEP_HOURS:-72}"
      SNAPSHOT_KEEP_HOURS: "${SNAPSHOT_KEEP_HOURS:-72}"
      MERGE_LAG_ALERT_MINUTES: "${MERGE_LAG_ALERT_MINUTES:-30}"
    # Replaces the image's own check (the API isn't running here). Fails only
    # on significant degradation; the long start period covers the first
    # bootstrap, which downloads and merges every extract.
    healthcheck:
      test: ["CMD", "bash", "/scripts/health.sh"]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 30m
      start_interval: 30s

  overpass-init:
    image: *overpass-image
    container_name: overpass-init
    restart: "no"
    # service_started, not service_healthy: after a database wipe the sidecar
    # is already running, and a stalled region mustn't block the stack. Init
    # waits for the snapshot marker, and for the merged stream, itself.
    depends_on:
      sidecar:
        condition: service_started
    entrypoint: ["bash", "/scripts/init.sh"]
    # A one-shot: the image's API healthcheck can't pass here.
    healthcheck:
      disable: true
    configs:
      - { source: lib, target: /scripts/lib.sh }
      - { source: init, target: /scripts/init.sh }
    volumes:
      - "overpass-db:/opt/overpass/db"
      - "overpass-diff:/opt/overpass/diff"
      - "sidecar-work:/work:ro"
      - "merged-replication:/replication:ro"
    environment:
      <<: *regions
      OVERPASS_META_MODE: "yes"
      IMPORT_OSM_COMPRESSION_METHOD: gz
      # Millions of elements buffered before flushing during import. Lower =
      # lower peak RAM, slower import; drop to 2 or 1 if 4 gets OOM-killed.
      IMPORT_FLUSH_SIZE: 4

  overpass:
    image: *overpass-image
    container_name: overpass
    restart: unless-stopped
    # On SIGTERM the entrypoint waits for the in-progress diff update to finish;
    # the 10s default would SIGKILL mid-write and risk corrupting the DB.
    stop_grace_period: 120s
    # restart: true makes Compose stop overpass while it recreates overpass-init
    # (e.g. after a region-list change, when init wipes and re-imports the
    # database), and start it again once init has finished.
    depends_on:
      overpass-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - "overpass-db:/opt/overpass/db"
      - "overpass-diff:/opt/overpass/diff"
      - "merged-replication:/opt/overpass/static/replication:ro"
    expose:
      - "8080"
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      OVERPASS_META_MODE: "yes"
      # The sidecar's merged stream, served by this container's own nginx.
      # The update frequency (60 s) is detected from it at startup.
      OVERPASS_DIFF_URL: "http://localhost:8080/replication/minute"
      OVERPASS_REPLICATE_ID: auto
      OVERPASS_AREAS: "yes"
      OVERPASS_CLEANUP_KEEP_HOURS: "${OVERPASS_CLEANUP_KEEP_HOURS:-72}"
      # Total memory (bytes) the dispatcher lets running queries reserve; each
      # query asks for 512 MiB by default. The entrypoint's default is 768 GiB,
      # which lets heavy queries OOM a small host instead of being refused.
      DISPATCHER_BASE_SPACE: 2147483648
    healthcheck:
      test: "curl -fsS http://localhost:8080/api/status || exit 1"
      interval: 30s
      start_period: 5m
      start_interval: 10s
      retries: 3
