# GENERATED by build.sh from compose.template.yml and sidecar/. Edit those, then run ./build.sh.
# Overpass API over several adjacent OpenStreetMap France regions, kept current
# by a sidecar that merges the regions' minute diffs into one stream (osmium +
# supercronic). Design: DESIGN.md. Written for Coolify's paste-a-compose deploy.
#
# Configuration (Coolify environment variables, or .env locally):
#   OSM_EXTRACT_URLS             (required) whitespace-separated extract URLs, e.g. .../<region>-latest.osm.pbf
#   OSM_DIFF_URLS                (required) the matching .../<region>/minute replication folders, same order (a trailing / is fine)
#   POLL_INTERVAL_MINUTES        5    sidecar tick; each region's state.txt is fetched once per tick
#   OVERPASS_CLEANUP_KEEP_HOURS  72   retention of merged diffs (sidecar) and fetched diffs (overpass)
#   SNAPSHOT_KEEP_HOURS          72   how long the bootstrap snapshot is kept for a fast re-import
#   MERGE_LAG_ALERT_MINUTES      30   sidecar turns unhealthy when the merged head is older than this
#   SIDECAR_MEM_LIMIT            1g   sidecar memory limit (raise for many or country-sized regions)
#   OVERPASS_IMAGE               b1tw153/overpass-api:0.7.62.11-r21
# Changing either region list takes effect on the next restart of the stack and
# rebuilds the merged stream, the snapshot and the database.
#
# The merged stream is public at https://<domain>/replication/ (status.txt there
# shows the merge and Overpass lag, region heads and error flags).

x-overpass-image: &overpass-image "${OVERPASS_IMAGE:-b1tw153/overpass-api:0.7.62.11-r21}"

x-regions: &regions
  OSM_EXTRACT_URLS: "${OSM_EXTRACT_URLS:?set OSM_EXTRACT_URLS to the region extract URLs}"
  OSM_DIFF_URLS: "${OSM_DIFF_URLS:?set OSM_DIFF_URLS to the region minute replication URLs}"

volumes:
  overpass-db: null
  # Diffs fetched by overpass, plus fetch_osc.log/.out, kept across redeploys.
  overpass-diff: null
  # Sidecar scratch: extracts, raw diffs, the bootstrap snapshot, supercronic.
  # Nothing here is needed to resume the merged stream.
  sidecar-work: null
  # The merged minute stream, served by overpass's nginx at /replication/.
  merged-replication: null

# The scripts, inlined by build.sh from sidecar/ (with $ escaped as $$).
configs:
  lib:
    content: |
      # Shared helpers for the sidecar and overpass-init scripts. Sourced, never run.
      # Runs inside the b1tw153/overpass-api image as uid 10001. Writes nothing when
      # sourced, since overpass-init mounts /work read-only.
      #
      # Volumes (see DESIGN.md):
      #   /work                sidecar-work: extracts, raw diffs, snapshot, status fragments, supercronic
      #   /replication         merged-replication: the merged minute stream, regions.txt, status.txt
      #   /opt/overpass/db     overpass-db (read-only in the sidecar)
      # shellcheck shell=bash disable=SC2034  # vars are used by the sourcing scripts

      WORK=$${WORK:-/work}
      REPL=$${REPL:-/replication}
      DB=$${DB:-/opt/overpass/db}
      SNAP=$$WORK/snapshot
      RAW=$$WORK/raw
      EXT=$$WORK/extracts
      STATUS_DIR=$$WORK/status
      ROOT_STATE=$$REPL/minute/state.txt

      KEEP_HOURS=$${OVERPASS_CLEANUP_KEEP_HOURS:-72}
      SNAPSHOT_KEEP_HOURS=$${SNAPSHOT_KEEP_HOURS:-72}
      MERGE_LAG_ALERT_MINUTES=$${MERGE_LAG_ALERT_MINUTES:-30}

      log() { printf '%s %s\n' "$$(date -u +%FT%TZ)" "$$*"; }
      warn() { log "WARNING: $$*"; }
      die() { log "ERROR: $$*" >&2; exit 1; }

      # Region lists, paired by position.
      read -r -a EXTRACT_URLS <<<"$${OSM_EXTRACT_URLS:-}"
      read -r -a DIFF_URLS <<<"$${OSM_DIFF_URLS:-}"
      NREG=$${#DIFF_URLS[@]}
      # Trailing slashes are dropped (OSM France's "copy link" includes one), so
      # ".../minute/" and ".../minute" are the same region in URLs and the stamp.
      for ((i = 0; i < NREG; i++)); do
        while [[ $${DIFF_URLS[i]} == */ ]]; do DIFF_URLS[i]=$${DIFF_URLS[i]%/}; done
      done
      for ((i = 0; i < $${#EXTRACT_URLS[@]}; i++)); do
        while [[ $${EXTRACT_URLS[i]} == */ ]]; do EXTRACT_URLS[i]=$${EXTRACT_URLS[i]%/}; done
      done
      unset i
      check_regions() {
        [ "$${#EXTRACT_URLS[@]}" -gt 0 ] || die "OSM_EXTRACT_URLS is not set"
        [ "$$NREG" -gt 0 ] || die "OSM_DIFF_URLS is not set"
        [ "$${#EXTRACT_URLS[@]}" -eq "$$NREG" ] \
          || die "OSM_EXTRACT_URLS has $${#EXTRACT_URLS[@]} entries but OSM_DIFF_URLS has $$NREG"
      }

      # Region name from its extract URL: .../golden_horseshoe-latest.osm.pbf -> golden_horseshoe
      region_name() { local b=$${EXTRACT_URLS[$$1]##*/}; b=$${b%.osm.pbf}; echo "$${b%-latest}"; }

      # The region-list stamp: one URL per line, extracts then diffs.
      stamp() { printf '%s\n' "$${EXTRACT_URLS[@]}" "$${DIFF_URLS[@]}"; }

      # 7350827 -> 007/350/827
      seq_path() { printf '%03d/%03d/%03d' $$(($$1 / 1000000)) $$(($$1 / 1000 % 1000)) $$(($$1 % 1000)); }

      # key=value from a state.txt or status file (backslash escapes removed).
      # Empty (and success) if the file doesn't exist.
      state_get() { [ -f "$$1" ] || return 0; sed -n "s/^$$2=//p" "$$1" | tr -d "\\\\" | tail -n 1; }

      # Epoch seconds of an ISO timestamp, or empty.
      epoch() { [ -n "$$1" ] && date -u -d "$$1" +%s 2>/dev/null; }

      # Whole minutes since an ISO timestamp, or empty.
      minutes_since() {
        local e
        e=$$(epoch "$$1") || return 0
        [ -n "$$e" ] && echo $$(( ($$(date +%s) - e) / 60 ))
      }

      CURL=(curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20)

      # fetch URL DEST: download to DEST.tmp then rename. Returns curl's exit code
      # (22 for an HTTP error such as 404). Aborts a stalled transfer, not a slow one.
      fetch() {
        local rc=0
        mkdir -p "$$(dirname "$$2")"
        "$${CURL[@]}" --speed-limit 1024 --speed-time 60 -o "$$2.tmp" "$$1" || rc=$$?
        if [ "$$rc" -eq 0 ]; then mv "$$2.tmp" "$$2"; else rm -f "$$2.tmp"; fi
        return "$$rc"
      }

      # HTTP status of a URL (for telling a 404 from other failures).
      http_code() { curl -s -o /dev/null -w '%{http_code}' --connect-timeout 20 -I "$$1" || true; }

      # Head sequence of a replication folder.
      remote_head() {
        local s
        s=$$("$${CURL[@]}" --max-time 60 "$$1/state.txt" | sed -n 's/^sequenceNumber=//p') || return 1
        [[ $$s =~ ^[0-9]+$$ ]] || return 1
        echo "$$s"
      }

      # Fetch region diffs FROM..TO (cached under $$RAW/<i>/) and merge them into one
      # simplified change file OUT. Region index i.
      fetch_and_merge_range() {
        local i=$$1 from=$$2 to=$$3 out=$$4 n f files=()
        for ((n = from; n <= to; n++)); do
          f="$$RAW/$$i/$$(seq_path "$$n").osc.gz"
          [ -s "$$f" ] || fetch "$${DIFF_URLS[$$i]}/$$(seq_path "$$n").osc.gz" "$$f" \
            || die "region $$(region_name "$$i"): cannot fetch diff $$n"
          files+=("$$f")
        done
        osmium merge-changes --simplify --no-progress -O -o "$$out" "$${files[@]}"
        rm -f "$${files[@]}"
      }

      # Write a per-sequence state file into the merged stream with its mtime set to
      # its own timestamp, so nginx's Last-Modified values are ~60 s apart (the
      # overpass service detects the update frequency from them).
      publish_seq_state() {
        local n=$$1 src=$$2 dst ts
        dst="$$REPL/minute/$$(seq_path "$$n").state.txt"
        mkdir -p "$$(dirname "$$dst")"
        cp "$$src" "$$dst.tmp"
        ts=$$(state_get "$$dst.tmp" timestamp)
        touch -d "$$ts" "$$dst.tmp"
        mv "$$dst.tmp" "$$dst"
      }

      # Point the merged root state.txt at sequence N (atomic).
      publish_root_state() {
        cp -p "$$REPL/minute/$$(seq_path "$$1").state.txt" "$$ROOT_STATE.tmp"
        mv "$$ROOT_STATE.tmp" "$$ROOT_STATE"
      }

      merged_head() { state_get "$$ROOT_STATE" sequenceNumber; }
      is_seeded() { [ -s "$$ROOT_STATE" ]; }

      # The database's replicate_id, but only if the database was built for the
      # current region list (otherwise init will wipe it, so it counts as none).
      db_replicate_id() {
        local rid
        [ "$$(cat "$$DB/regions.txt" 2>/dev/null)" = "$$(stamp)" ] || return 0
        rid=$$(cat "$$DB/replicate_id" 2>/dev/null) || return 0
        [[ $$rid =~ ^[0-9]+$$ ]] && echo "$$rid"
        return 0
      }

      # Sequence S of the kept snapshot, if it exists and was built for the current
      # region list.
      snapshot_seq() {
        [ -s "$$SNAP/merged.osm.pbf" ] && [ -f "$$SNAP/ready" ] || return 0
        [ "$$(sed '1,2d' "$$SNAP/ready")" = "$$(stamp)" ] || return 0
        state_get "$$SNAP/ready" sequenceNumber
      }

      # Small key=value files under $$STATUS_DIR (one per job).
      kv_get() { state_get "$$STATUS_DIR/$$1" "$$2"; }
      kv_set() {
        local f=$$STATUS_DIR/$$1
        mkdir -p "$$STATUS_DIR"
        { grep -v "^$$2=" "$$f" 2>/dev/null || true; echo "$$2=$$3"; } >"$$f.tmp"
        mv "$$f.tmp" "$$f"
      }

      # Rewrite /replication/status.txt from live values plus the jobs' fragments.
      write_status() {
        is_seeded || [ -d "$$REPL/minute" ] || return 0
        mkdir -p "$$STATUS_DIR"
        (
          flock 9
          local head ts rid s ready_epoch
          head=$$(merged_head)
          ts=$$(state_get "$$ROOT_STATE" timestamp)
          rid=$$(db_replicate_id)
          s=$$(snapshot_seq)
          {
            echo "updated=$$(date -u +%FT%TZ)"
            echo "merged_head=$$head"
            echo "merged_timestamp=$$ts"
            echo "merge_lag_minutes=$$(minutes_since "$$ts")"
            echo "replicate_id=$$rid"
            if [ -n "$$rid" ] && [ -n "$$head" ]; then echo "overpass_lag_minutes=$$((head - rid))"; else echo "overpass_lag_minutes="; fi
            echo "snapshot_seq=$$s"
            if [ -n "$$s" ]; then
              ready_epoch=$$(stat -c %Y "$$SNAP/ready")
              echo "snapshot_expires=$$(date -u -d "@$$((ready_epoch + SNAPSHOT_KEEP_HOURS * 3600))" +%FT%TZ)"
            else
              echo "snapshot_expires="
            fi
            cat "$$STATUS_DIR/catch-up.txt" "$$STATUS_DIR/bootstrap.txt" 2>/dev/null || true
          } >"$$REPL/status.txt.tmp"
          mv "$$REPL/status.txt.tmp" "$$REPL/status.txt"
        ) 9>"$$STATUS_DIR/.lock"
      }

      # Memory limit of this container in bytes, or "max".
      mem_limit() { cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max; }

      # Peak memory of this container so far, in MiB (cgroup v2), or "?".
      mem_peak_mib() {
        local p
        p=$$(cat /sys/fs/cgroup/memory.peak 2>/dev/null) || { echo '?'; return; }
        echo $$((p / 1048576))
      }

      # Free bytes on the filesystem holding a path.
      free_bytes() { df -B1 --output=avail "$$1" | tail -n 1 | tr -d ' '; }
  entrypoint:
    content: |
      #!/usr/bin/env bash
      # Sidecar entrypoint. Starts as root only to give uid 10001 the roots of the
      # /work and /replication volumes (Docker creates them owned by root, since the
      # image has no such directories), then drops to 10001 and execs supercronic.
      set -euo pipefail
      HERE=$$(dirname "$$0")
      UID_GID=10001

      if [ "$$(id -u)" = 0 ]; then
        for d in /work /replication; do
          [ "$$(stat -c %u:%g "$$d")" = "$$UID_GID:$$UID_GID" ] || chown "$$UID_GID:$$UID_GID" "$$d"
        done
        exec setpriv --reuid="$$UID_GID" --regid="$$UID_GID" --clear-groups -- bash "$$0" "$$@"
      fi

      # shellcheck source=lib.sh
      source "$$HERE/lib.sh"
      check_regions
      POLL=$${POLL_INTERVAL_MINUTES:-5}
      if ! [[ $$POLL =~ ^[0-9]+$$ ]] || ((POLL < 1 || POLL > 59)); then die "POLL_INTERVAL_MINUTES must be 1..59, got '$$POLL'"; fi
      ((POLL >= 5)) || warn "POLL_INTERVAL_MINUTES=$$POLL is below 5; OSM France asks clients to poll state.txt at most every 5 minutes"
      log "sidecar starting: $$NREG regions ($$(for ((i = 0; i < NREG; i++)); do printf '%s ' "$$(region_name "$$i")"; done)), tick every $$POLL minutes"

      # supercronic, cached on sidecar-work and checked on every start.
      SC_VERSION=v0.2.51
      SC_SHA1=1692066e350a88ff4d7d6474fe3c7a6c41ec5e89
      SC=$$WORK/bin/supercronic-$$SC_VERSION
      mkdir -p "$$WORK/bin"
      if ! echo "$$SC_SHA1  $$SC" | sha1sum -c --status - 2>/dev/null; then
        log "downloading supercronic $$SC_VERSION"
        fetch "https://github.com/aptible/supercronic/releases/download/$$SC_VERSION/supercronic-linux-amd64" "$$SC.tmp.dl" \
          || die "cannot download supercronic"
        echo "$$SC_SHA1  $$SC.tmp.dl" | sha1sum -c --status - || { rm -f "$$SC.tmp.dl"; die "supercronic SHA1 mismatch"; }
        chmod +x "$$SC.tmp.dl"
        mv "$$SC.tmp.dl" "$$SC"
      fi
      find "$$WORK/bin" -mindepth 1 -maxdepth 1 ! -name "supercronic-$$SC_VERSION" -exec rm -rf {} +

      # Region-list check: a stream built for other regions is discarded with the
      # snapshot and raw diffs (overpass-init then wipes and re-imports the database).
      if [ -n "$$(ls -A "$$REPL")" ] && [ "$$(cat "$$REPL/regions.txt" 2>/dev/null)" != "$$(stamp)" ]; then
        log "region list changed (or merged-replication has no regions.txt): discarding the merged stream, snapshot and raw diffs, and rebuilding from scratch"
        log "previous regions: $$(tr '\n' ' ' <"$$REPL/regions.txt" 2>/dev/null || echo none)"
        find "$$REPL" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        rm -rf "$$SNAP" "$$EXT" "$$RAW" "$$STATUS_DIR" "$$WORK/tmp"
      fi

      # One bootstrap run before scheduling; without a seeded stream there is nothing
      # to schedule, so exit and let the restart policy retry.
      bash "$$HERE/bootstrap.sh" || warn "bootstrap failed; it will be retried at the next tick"
      is_seeded || die "merged stream is still not seeded; exiting so the container restarts and retries"

      cat >/tmp/crontab <<EOF
      2-59/$$POLL * * * * bash $$HERE/catch-up.sh
      2-59/$$POLL * * * * bash $$HERE/bootstrap.sh
      EOF
      log "starting supercronic with: $$(tr '\n' ';' </tmp/crontab)"
      exec "$$SC" /tmp/crontab
  bootstrap:
    content: |
      #!/usr/bin/env bash
      # Bootstrap: build the merged snapshot when it is needed, and seed the merged
      # stream if it doesn't exist yet. Run by the entrypoint once, then by
      # supercronic at every tick. Most runs decide there is nothing to do and exit.
      #
      # Builds a snapshot when the stream isn't seeded, or when the database needs an
      # import (no replicate_id for the current region list) and there is no usable
      # snapshot (one for the current region list whose diffs S+1..head are all
      # still in the stream).
      set -euo pipefail
      # shellcheck source=lib.sh
      source "$$(dirname "$$0")/lib.sh"
      check_regions

      head=$$(merged_head)
      rid=$$(db_replicate_id)
      kept=$$(snapshot_seq)
      usable=''
      if is_seeded && [ -n "$$kept" ]; then
        if ((kept == head)) || [ -f "$$REPL/minute/$$(seq_path $$((kept + 1))).osc.gz" ]; then usable=1; fi
      fi
      if is_seeded && { [ -n "$$rid" ] || [ -n "$$usable" ]; }; then
        exit 0
      fi

      # From here on this is a real run: record it for status.txt and health.sh.
      # A previous run still marked "running" was killed (e.g. OOM), so it failed.
      fails=$$(kv_get bootstrap.txt bootstrap_consecutive_failures)
      fails=$${fails:-0}
      [ "$$(kv_get bootstrap.txt bootstrap_result)" = running ] && fails=$$((fails + 1))
      kv_set bootstrap.txt bootstrap_consecutive_failures "$$fails"
      kv_set bootstrap.txt bootstrap_last_start "$$(date -u +%FT%TZ)"
      kv_set bootstrap.txt bootstrap_result running
      RESULT=ok
      on_exit() {
        local rc=$$?
        if [ "$$rc" -eq 0 ]; then
          fails=0
        else
          RESULT=failed
          fails=$$((fails + 1))
          log "bootstrap failed (exit $$rc, $$fails consecutive failures)"
        fi
        kv_set bootstrap.txt bootstrap_last_end "$$(date -u +%FT%TZ)"
        kv_set bootstrap.txt bootstrap_result "$$RESULT"
        kv_set bootstrap.txt bootstrap_consecutive_failures "$$fails"
        kv_set bootstrap.txt bootstrap_failing "$$((fails >= 3 ? 1 : 0))"
        write_status || true
      }
      trap on_exit EXIT

      if ! is_seeded; then
        log "bootstrap: merged stream not seeded; building the first snapshot from $$NREG regions"
      else
        log "bootstrap: database needs an import and no usable snapshot exists; building one from $$NREG regions"
      fi

      # An old snapshot (other region list, or its diffs pruned) is useless now.
      # Remove the marker first so init never imports a file we are replacing.
      rm -f "$$SNAP/ready" "$$SNAP/merged.osm.pbf" "$$SNAP"/*.tmp
      BUILD=$$SNAP/build
      mkdir -p "$$EXT" "$$BUILD"

      # Optional free-space guard: downloads plus the merge output need about 2 x E.
      need=0
      for ((i = 0; i < NREG; i++)); do
        len=$$(curl -fsSIL --connect-timeout 20 "$${EXTRACT_URLS[i]}" | tr -d '\r' \
          | sed -n 's/^[Cc]ontent-[Ll]ength: *//p' | tail -n 1) || len=''
        [[ $$len =~ ^[0-9]+$$ ]] && need=$$((need + len))
      done
      if ((need > 0)) && ((2 * need > $$(free_bytes "$$WORK"))); then
        warn "sidecar-work has $$(($$(free_bytes "$$WORK") / 1048576)) MiB free; bootstrap needs about $$((2 * need / 1048576)) MiB"
      fi

      # 1. Download (or reuse a download from a run in the last day that had to
      # wait), read s_i from the PBF header, check metadata.
      declare -a SEQ PBF
      for ((i = 0; i < NREG; i++)); do
        name=$$(region_name "$$i")
        PBF[i]=$$EXT/$$name.osm.pbf
        if [ -s "$${PBF[i]}" ] && [ -n "$$(find "$${PBF[i]}" -mmin -1440)" ]; then
          log "$$name: reusing $${PBF[i]} downloaded by an earlier run"
        else
          log "$$name: downloading $${EXTRACT_URLS[i]}"
          fetch "$${EXTRACT_URLS[i]}" "$${PBF[i]}" || die "$$name: download failed"
          # Warn-only md5 (OSM France .md5 files can be stale; none exists for -latest).
          code=$$(http_code "$${EXTRACT_URLS[i]}.md5")
          if [ "$$code" = 200 ]; then
            exp=$$("$${CURL[@]}" "$${EXTRACT_URLS[i]}.md5" | awk '{print $$1}')
            act=$$(md5sum "$${PBF[i]}" | awk '{print $$1}')
            if [ "$$exp" = "$$act" ]; then log "$$name: md5 ok"; else warn "$$name: md5 mismatch (stale .md5?), continuing"; fi
          else
            log "$$name: no .md5 (HTTP $$code), skipping check"
          fi
        fi
        SEQ[i]=$$(osmium fileinfo -g header.option.osmosis_replication_sequence_number "$${PBF[i]}")
        [[ $${SEQ[i]} =~ ^[0-9]+$$ ]] || die "$$name: no replication sequence in PBF header"
        # One pass over the file; -g takes a single variable, so read the JSON.
        meta=$$(osmium fileinfo -e -j "$${PBF[i]}" | tr -d ' \n' \
          | sed -n 's/.*"all_objects":{\([^}]*\)}.*/\1/p')
        if [ "$$meta" = '"version":true,"timestamp":true,"changeset":true,"user":true,"uid":true' ]; then
          meta=full
        else
          warn "$$name: not every object has full metadata: $$meta"
        fi
        log "$$name: s=$${SEQ[i]} metadata=$$meta"
      done

      # 2. S = max(s_i). With a live stream, S must not be ahead of its head.
      S=$${SEQ[0]}
      for s in "$${SEQ[@]}"; do ((s > S)) && S=$$s; done
      log "snapshot sequence S=$$S"
      if is_seeded && ((S > head)); then
        RESULT=waiting
        log "S=$$S is ahead of the merged head $$head; keeping the downloads and retrying at the next tick"
        exit 0
      fi

      # 3. Roll each region forward to S, deleting each original once its new file is complete.
      declare -a AT_S
      for ((i = 0; i < NREG; i++)); do
        name=$$(region_name "$$i")
        if ((SEQ[i] == S)); then AT_S[i]=$${PBF[i]}; continue; fi
        log "$$name: rolling forward $$((S - SEQ[i])) minutes ($${SEQ[i]}+1..$$S)"
        fetch_and_merge_range "$$i" $$((SEQ[i] + 1)) "$$S" "$$BUILD/$$name.osc.gz"
        osmium apply-changes --no-progress -O -o "$$BUILD/$$name.osm.pbf.tmp" -f pbf "$${PBF[i]}" "$$BUILD/$$name.osc.gz"
        mv "$$BUILD/$$name.osm.pbf.tmp" "$$BUILD/$$name.osm.pbf"
        rm -f "$$BUILD/$$name.osc.gz" "$${PBF[i]}"
        AT_S[i]=$$BUILD/$$name.osm.pbf
      done

      # 4. Merge, with the sequence and timestamp of S in the header.
      fetch "$${DIFF_URLS[0]}/$$(seq_path "$$S").state.txt" "$$BUILD/S.state.txt" || die "cannot fetch state for $$S"
      TS=$$(state_get "$$BUILD/S.state.txt" timestamp)
      limit=$$(mem_limit)
      est=$$((100 + 80 * NREG))
      if [ "$$limit" != max ] && ((est * 1048576 > limit * 8 / 10)); then
        warn "osmium merge of $$NREG regions needs about $$est MiB, above 80% of the $$((limit / 1048576)) MiB memory limit; raise SIDECAR_MEM_LIMIT if bootstrap is killed"
      fi
      log "merging $${#AT_S[@]} files (estimated peak $$est MiB)"
      osmium merge --no-progress -O -o "$$SNAP/merged.osm.pbf.tmp" -f pbf \
        --output-header="osmosis_replication_sequence_number=$$S" \
        --output-header="osmosis_replication_timestamp=$$TS" \
        "$${AT_S[@]}"
      mv "$$SNAP/merged.osm.pbf.tmp" "$$SNAP/merged.osm.pbf"

      # 5. Marker last, so init never imports a partial file. Then drop the inputs.
      { echo "sequenceNumber=$$S"; echo "timestamp=$$TS"; stamp; } >"$$SNAP/ready.tmp"
      mv "$$SNAP/ready.tmp" "$$SNAP/ready"
      rm -f "$${AT_S[@]}"
      log "snapshot ready: $$SNAP/merged.osm.pbf ($$(du -m "$$SNAP/merged.osm.pbf" | cut -f1) MiB, S=$$S), container peak memory $$(mem_peak_mib) MiB"

      # Seed the stream, only if it has no head yet (never move a live head).
      if ! is_seeded; then
        mkdir -p "$$REPL/minute"
        stamp >"$$REPL/regions.txt.tmp"
        mv "$$REPL/regions.txt.tmp" "$$REPL/regions.txt"
        for n in $$((S - 2)) $$((S - 1)) "$$S"; do
          fetch "$${DIFF_URLS[0]}/$$(seq_path "$$n").state.txt" "$$BUILD/seed.state.txt" || die "cannot fetch state for $$n"
          publish_seq_state "$$n" "$$BUILD/seed.state.txt"
        done
        publish_root_state "$$S"
        log "seeded merged stream at $$S"
      fi
      rm -rf "$$BUILD"
  catch-up:
    content: |
      #!/usr/bin/env bash
      # Catch-up: one tick of the ongoing merge, run by supercronic.
      #   1. Read each region's head (one state.txt per region); barrier = min(heads).
      #   2. For each N from the merged head + 1 to the barrier: fetch every region's
      #      N.osc.gz, apply the delete tie-break, merge, publish (osc, per-sequence
      #      state, root state).
      #   3. Expire the snapshot, prune merged diffs (guarded), check the database
      #      can still catch up, and rewrite status.txt.
      set -euo pipefail
      # shellcheck source=lib.sh
      source "$$(dirname "$$0")/lib.sh"
      check_regions

      is_seeded || { log "merged stream not seeded yet (bootstrap pending); nothing to do"; exit 0; }
      [ "$$(cat "$$REPL/regions.txt" 2>/dev/null)" = "$$(stamp)" ] \
        || die "merged stream was built for another region list; restart the sidecar to rebuild it"
      trap 'write_status || true' EXIT
      mkdir -p "$$STATUS_DIR"

      last=$$(merged_head)
      B=''
      heads=()
      for ((i = 0; i < NREG; i++)); do
        name=$$(region_name "$$i")
        if ! h=$$(remote_head "$${DIFF_URLS[i]}"); then
          kv_set catch-up.txt region_unreachable "$$name"
          die "$$name: cannot read $${DIFF_URLS[i]}/state.txt"
        fi
        heads+=("$$name=$$h")
        kv_set catch-up.txt "region_head_$$name" "$$h"
        if [ -z "$$B" ] || ((h < B)); then B=$$h; fi
      done
      kv_set catch-up.txt region_unreachable ''
      kv_set catch-up.txt barrier "$$B"
      kv_set catch-up.txt catchup_last_run "$$(date -u +%FT%TZ)"
      log "tick: merged head $$last, region heads $${heads[*]}, barrier $$B, merging $$((B > last ? B - last : 0))"

      # A database behind the oldest kept diff can never catch up (only possible if
      # the stream was wiped or re-seeded while the database was behind). Checked
      # before and after merging, since a long backlog can take this run an hour.
      check_db() {
        local rid head
        rid=$$(db_replicate_id)
        head=$$(merged_head)
        if [ -n "$$rid" ] && ((rid < head)) && [ ! -f "$$REPL/minute/$$(seq_path $$((rid + 1))).osc.gz" ]; then
          kv_set catch-up.txt db_cant_catch_up 1
          log "ERROR: the database (replicate_id=$$rid) needs merged diff $$((rid + 1)), which is no longer in the stream. Stop the stack, delete the overpass-db volume, and redeploy; the sidecar then builds a new snapshot and overpass-init re-imports."
        else
          kv_set catch-up.txt db_cant_catch_up 0
        fi
      }
      check_db
      write_status

      TMP=$$WORK/tmp/catch-up
      missing=''
      merged=0 drops=0
      for ((n = last + 1; n <= B; n++)); do
        rm -rf "$$TMP" && mkdir -p "$$TMP/filtered"
        sp=$$(seq_path "$$n")
        inputs=()
        for ((i = 0; i < NREG; i++)); do
          f="$$RAW/$$i/$$sp.osc.gz"
          if [ ! -s "$$f" ] && ! fetch "$${DIFF_URLS[i]}/$$sp.osc.gz" "$$f"; then
            code=$$(http_code "$${DIFF_URLS[i]}/$$sp.osc.gz")
            [ "$$code" = 404 ] || die "$$(region_name "$$i"): diff $$n failed with HTTP $$code; retrying at the next tick"
            missing="$$(region_name "$$i") diff $$n"
            break 2
          fi
          inputs+=("$$f")
        done
        fetch "$${DIFF_URLS[0]}/$$sp.state.txt" "$$TMP/state.txt" || die "cannot fetch state for $$n"

        # Tie-break: drop deletes that another region has as create/modify at the same version.
        perl "$$(dirname "$$0")/tiebreak.pl" "$$TMP/filtered" "$${inputs[@]}" 2>"$$TMP/drops"
        if [ -s "$$TMP/drops" ]; then
          while read -r line; do log "tie-break $$n: $${line//$$RAW\//}"; done <"$$TMP/drops"
          drops=$$((drops + $$(wc -l <"$$TMP/drops")))
        fi
        filtered=()
        for ((i = 1; i <= NREG; i++)); do filtered+=("$$TMP/filtered/$$i.osc.gz"); done
        osmium merge-changes --simplify --no-progress -O -o "$$TMP/merged.osc.gz" "$${filtered[@]}"

        # Publish in order: osc, per-sequence state, root state.
        dst=$$REPL/minute/$$sp.osc.gz
        mkdir -p "$$(dirname "$$dst")"
        mv "$$TMP/merged.osc.gz" "$$dst"
        publish_seq_state "$$n" "$$TMP/state.txt"
        publish_root_state "$$n"
        rm -f "$${inputs[@]}"
        merged=$$((merged + 1))
        ((merged % 10)) || write_status
      done
      rm -rf "$$TMP"
      head=$$(merged_head)
      log "merged $$merged, tie-break drops $$drops, merged head $$head"

      # Missing upstream diff at or below a region's head: most likely pruned after
      # long downtime. Count ticks; at 3 the stream can't resume.
      if [ -n "$$missing" ]; then
        ticks=$$(kv_get catch-up.txt missing_diff_ticks)
        ticks=$$(($${ticks:-0} + 1))
        kv_set catch-up.txt missing_diff_ticks "$$ticks"
        warn "$$missing is gone upstream (HTTP 404) although the region's head is past it ($$ticks consecutive ticks)"
        if ((ticks >= 3)); then
          kv_set catch-up.txt stream_cant_resume 1
          log "ERROR: the merged stream can't resume: upstream no longer has the diffs it needs. Stop the stack, delete the merged-replication and overpass-db volumes, and redeploy."
        fi
      else
        kv_set catch-up.txt missing_diff_ticks 0
        kv_set catch-up.txt stream_cant_resume 0
      fi

      rid=$$(db_replicate_id)

      # Expire the snapshot once the database no longer needs it and it is older
      # than SNAPSHOT_KEEP_HOURS. Marker first, so init never sees a half-deleted one.
      if [ -f "$$SNAP/ready" ] && [ -n "$$rid" ] \
        && [ -n "$$(find "$$SNAP/ready" -mmin +$$((SNAPSHOT_KEEP_HOURS * 60)))" ]; then
        log "snapshot is older than $${SNAPSHOT_KEEP_HOURS}h and the database is imported; deleting it"
        rm -f "$$SNAP/ready"
        rm -f "$$SNAP/merged.osm.pbf"
      fi

      # Prune merged diffs older than KEEP_HOURS, but never one the database or a
      # kept snapshot still needs (N > replicate_id or N > S).
      limit=$$((head - KEEP_HOURS * 60))
      [ -n "$$rid" ] && ((rid + 1 < limit)) && limit=$$((rid + 1))
      S=$$(snapshot_seq)
      [ -n "$$S" ] && ((S + 1 < limit)) && limit=$$((S + 1))
      mkdir -p "$$WORK/tmp"
      (cd "$$REPL/minute" && find . -mindepth 3 -maxdepth 3 -type f \( -name '*.osc.gz' -o -name '*.state.txt' \) \
        | awk -F/ -v lim="$$limit" '{ n = $$2 * 1000000 + $$3 * 1000 + substr($$4, 1, 3); if (n < lim) print }' \
        >"$$WORK/tmp/prune.list" && xargs -r rm -f <"$$WORK/tmp/prune.list")
      pruned=$$(wc -l <"$$WORK/tmp/prune.list")
      rm -f "$$WORK/tmp/prune.list"
      find "$$REPL/minute" -mindepth 1 -type d -empty -delete
      ((pruned == 0)) || log "pruned $$pruned merged files below sequence $$limit"
      # Raw diffs are deleted after each merge; clear any left by a killed run.
      [ -d "$$RAW" ] && find "$$RAW" -type f -mmin +1440 -delete

      check_db

      [ -z "$$missing" ]
  health:
    content: |
      #!/usr/bin/env bash
      # Sidecar healthcheck. Fails only when the service is significantly degraded,
      # not on normal lag. Prints the reason.
      set -uo pipefail
      # shellcheck source=lib.sh
      source "$$(dirname "$$0")/lib.sh"

      fail() { echo "unhealthy: $$*"; exit 1; }

      [ -s "$$ROOT_STATE" ] || fail "merged stream not seeded yet ($$ROOT_STATE missing)"
      st=$$REPL/status.txt
      [ "$$(state_get "$$st" stream_cant_resume)" = 1 ] && fail "stream can't resume (upstream diffs gone); wipe merged-replication and overpass-db"
      [ "$$(state_get "$$st" db_cant_catch_up)" = 1 ] && fail "database can't catch up; wipe overpass-db"
      [ "$$(state_get "$$st" bootstrap_failing)" = 1 ] && fail "bootstrap has failed $$(state_get "$$st" bootstrap_consecutive_failures) times in a row; check the sidecar log"

      head=$$(merged_head)
      ts=$$(state_get "$$ROOT_STATE" timestamp)
      lag=$$(minutes_since "$$ts")
      [ -n "$$lag" ] || fail "cannot read the merged head timestamp"
      if ((lag > MERGE_LAG_ALERT_MINUTES)); then
        # A long backlog (after a seed from an extract, or a long stall) is fine
        # while catch-up is working through it: the head's diff is under 5 min old.
        [ -n "$$(find "$$REPL/minute/$$(seq_path "$$head").osc.gz" -mmin -5 2>/dev/null)" ] \
          || fail "merged head $$head is $$lag minutes old (limit $$MERGE_LAG_ALERT_MINUTES) and not advancing; check region_unreachable and region_head_* in status.txt for a stalled region"
        echo "healthy: catching up, merged head $$head is $$lag minutes old"
        exit 0
      fi
      echo "healthy: merged head $$head, $$lag minutes old"
  tiebreak:
    content: |
      #!/usr/bin/perl
      # Delete tie-break for merging OSM France region minute diffs.
      #
      # Usage: perl tiebreak.pl OUTDIR IN1.osc.gz [IN2.osc.gz ...]
      #
      # Writes OUTDIR/1.osc.gz, OUTDIR/2.osc.gz, ... (one per input, in input order).
      # Each output is its input minus every <delete>d element whose type, id and
      # version appear as a create or modify in any input. A region diff can delete an
      # object at the same version that a neighbour has as modify (an artefact of how
      # regions are cut), and a real OSM deletion always has a new version, so such a
      # delete is never real. After this filter, `osmium merge-changes --simplify` of
      # the outputs no longer depends on input order.
      #
      # Parses the line-oriented osmChange that OSM France publishes
      # (generator="xmlwriter"): one element start tag per line, with child lines
      # (nd, tag, member, bbox) up to </node|way|relation>. Dies on anything else,
      # so a format change fails loudly instead of passing through unfiltered.
      # Prints one line per dropped delete to stderr: "dropped <file> <type>/<id> v<version>".
      use strict;
      use warnings;
      use IO::Uncompress::Gunzip qw($$GunzipError);
      use IO::Compress::Gzip qw($$GzipError);

      die "usage: $$0 OUTDIR IN.osc.gz...\n" unless @ARGV >= 2;
      my ($$outdir, @inputs) = @ARGV;
      die "$$0: $$outdir is not a directory\n" unless -d $$outdir;

      # Calls $$cb->($$line, $$action, $$key) for every line of an osmChange file.
      # $$action is create/modify/delete inside an action block, else undef.
      # $$key is "type/id/version" on the lines of an element (start tag through
      # end tag), else undef.
      sub scan {
          my ($$path, $$cb) = @_;
          my $$in = IO::Uncompress::Gunzip->new($$path, MultiStream => 1)
              or die "$$0: $$path: $$GunzipError\n";
          my ($$action, $$key, $$open, $$seen_root, $$closed_root);
          while (defined(my $$line = $$in->getline)) {
              my $$t = $$line;
              $$t =~ s/^\s+|\s+$$//g;
              my $$lineno = $$in->input_line_number;
              my $$bad = sub { die "$$0: $$path:$$lineno: unexpected line: $$t\n" };
              if ($$t eq '') {
                  # blank lines are harmless
              } elsif (defined $$open) {
                  # inside a multi-line element
                  if ($$t eq "</$$open>") {
                      $$cb->($$line, $$action, $$key);
                      undef $$open;
                      undef $$key;
                      next;
                  }
                  $$t =~ m{^<(?:nd|tag|member|bbox)\s.*/>$$} or $$bad->();
              } elsif (defined $$action) {
                  if ($$t eq "</$$action>") {
                      undef $$action;
                  } elsif ($$t =~ m{^<(node|way|relation)\s(.*?)(/?)>$$}) {
                      my ($$type, $$attrs, $$selfclose) = ($$1, $$2, $$3);
                      my ($$id) = $$attrs =~ /(?:^|\s)id="(-?\d+)"/;
                      my ($$ver) = $$attrs =~ /(?:^|\s)version="(\d+)"/;
                      defined $$id && defined $$ver or $$bad->();
                      $$key = "$$type/$$id/$$ver";
                      if ($$selfclose) {
                          $$cb->($$line, $$action, $$key);
                          undef $$key;
                          next;
                      }
                      $$open = $$type;
                  } else {
                      $$bad->();
                  }
              } elsif ($$t =~ m{^<\?xml\s.*\?>$$}) {
                  # XML declaration
              } elsif (!$$seen_root && $$t =~ m{^<osmChange(\s.*)?>$$}) {
                  $$seen_root = 1;
              } elsif ($$seen_root && !$$closed_root && $$t =~ m{^<(create|modify|delete)\s*(/?)>$$}) {
                  $$action = $$1 unless $$2;
              } elsif ($$seen_root && !$$closed_root && $$t eq '</osmChange>') {
                  $$closed_root = 1;
              } else {
                  $$bad->();
              }
              $$cb->($$line, $$action, $$key);
          }
          $$in->close;
          die "$$0: $$path: truncated (no </osmChange>)\n" unless $$closed_root;
      }

      # Pass 1: every create/modify key in any input.
      my %live;
      for my $$path (@inputs) {
          scan($$path, sub {
              my (undef, $$action, $$key) = @_;
              $$live{$$key} = 1 if defined $$key && $$action ne 'delete';
          });
      }

      # Pass 2: copy each input, dropping tied deletes.
      my $$n = 0;
      for my $$path (@inputs) {
          $$n++;
          my $$final = "$$outdir/$$n.osc.gz";
          my $$tmp = "$$final.tmp";
          my $$out = IO::Compress::Gzip->new($$tmp) or die "$$0: $$tmp: $$GzipError\n";
          my %reported;
          scan($$path, sub {
              my ($$line, $$action, $$key) = @_;
              if (defined $$key && $$action eq 'delete' && $$live{$$key}) {
                  my ($$type, $$id, $$ver) = split m{/}, $$key;
                  print STDERR "dropped $$path $$type/$$id v$$ver\n" unless $$reported{$$key}++;
                  return;
              }
              $$out->print($$line) or die "$$0: $$tmp: write failed\n";
          });
          $$out->close or die "$$0: $$tmp: $$GzipError\n";
          rename $$tmp, $$final or die "$$0: rename $$tmp: $$!\n";
      }
  init:
    content: |
      #!/usr/bin/env bash
      # overpass-init: import the sidecar's merged snapshot when the database needs it.
      #   - replicate_id present and built for the current region list: nothing to do.
      #   - replicate_id present but built for another region list: wipe and re-import.
      #   - otherwise: clear any partial import and the diff cache, wait for the snapshot marker, import,
      #     then write the region stamp and (last) replicate_id = S.
      # Either way, exit only once the merged stream is seeded: overpass detects its
      # update frequency from the stream at startup, and if that fails the image's
      # entrypoint idles (unhealthy) instead of exiting, so it would never retry.
      # /work (sidecar-work) and /replication (merged-replication) are mounted read-only.
      set -euo pipefail
      # shellcheck source=lib.sh
      source "$$(dirname "$$0")/lib.sh"
      check_regions
      BIN=/opt/overpass/bin
      DIFF=/opt/overpass/diff
      mkdir -p "$$DB" "$$DIFF"

      wait_for_stream() {
        local waited=0
        until is_seeded; do
          ((waited % 300 == 0)) && log "waiting for the sidecar to seed the merged stream ($$((waited / 60)) min)"
          sleep 10
          waited=$$((waited + 10))
        done
      }

      if [ -f "$$DB/replicate_id" ]; then
        if [ "$$(cat "$$DB/regions.txt" 2>/dev/null)" = "$$(stamp)" ]; then
          log "database already initialized for these regions (replicate_id=$$(cat "$$DB/replicate_id")); skipping import"
          wait_for_stream
          exit 0
        fi
        log "WARNING: the database was built for a different region list; WIPING it and re-importing"
        log "database regions: $$(tr '\n' ' ' <"$$DB/regions.txt" 2>/dev/null || echo 'none recorded')"
        log "configured regions: $$(stamp | tr '\n' ' ')"
      fi

      # No valid replicate_id => no valid database; clear files from a failed import.
      # Also clear overpass's diff cache: apply_osc_to_db.sh applies every diff in it
      # above replicate_id, so diffs left from the old database (another region list,
      # or an old stream) would be applied to the new one.
      log "clearing database files and the overpass diff cache ..."
      find "$$DB" "$$DIFF" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      log "waiting for the sidecar's snapshot ($$SNAP/ready for the current region list) ..."
      waited=0
      while S=$$(snapshot_seq) && [ -z "$$S" ]; do
        ((waited % 300 == 0)) && ((waited > 0)) && log "still waiting for the snapshot ($$((waited / 60)) min); see the sidecar log"
        sleep 30
        waited=$$((waited + 30))
      done
      PBF=$$SNAP/merged.osm.pbf
      size=$$(stat -c %s "$$PBF")
      log "snapshot ready: S=$$S, $$((size / 1048576)) MiB"
      if ((20 * size > $$(free_bytes "$$DB"))); then
        log "WARNING: overpass-db has $$(($$(free_bytes "$$DB") / 1048576)) MiB free; the import may need about $$((20 * size / 1048576)) MiB"
      fi

      case "$${OVERPASS_META_MODE:-yes}" in
        yes) META_FLAG=--meta ;;
        *) die "this stack supports OVERPASS_META_MODE=yes only" ;;
      esac
      COMP=$${IMPORT_OSM_COMPRESSION_METHOD:-gz}
      FLUSH=$${IMPORT_FLUSH_SIZE:-4}
      log "importing ($$META_FLAG, compression=$$COMP, flush-size=$$FLUSH) ..."
      osmium cat -f osm "$$PBF" \
        | "$$BIN/update_database" --db-dir="$$DB" "$$META_FLAG" \
          --flush-size="$$FLUSH" \
          --compression-method="$$COMP" --map-compression-method="$$COMP"

      # The stamp first, then replicate_id (the "import completed" marker) last.
      [[ $$S =~ ^[0-9]+$$ ]] || die "snapshot sequence '$$S' is not a number"
      stamp >"$$DB/regions.txt"
      echo "$$S" >"$$DB/replicate_id"
      log "database ready: replicate_id=$$S"
      wait_for_stream

services:
  sidecar:
    image: *overpass-image
    container_name: overpass-sidecar
    restart: unless-stopped
    # Root only to chown the volume roots; entrypoint.sh drops to uid 10001.
    user: "0"
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    # supercronic waits for a running job on SIGTERM; a normal catch-up run
    # takes seconds, and a killed one loses at most the minute it was merging.
    stop_grace_period: 60s
    mem_limit: "${SIDECAR_MEM_LIMIT:-1g}"
    memswap_limit: "${SIDECAR_MEM_LIMIT:-1g}"
    configs:
      - { source: lib, target: /scripts/lib.sh }
      - { source: entrypoint, target: /scripts/entrypoint.sh }
      - { source: bootstrap, target: /scripts/bootstrap.sh }
      - { source: catch-up, target: /scripts/catch-up.sh }
      - { source: health, target: /scripts/health.sh }
      - { source: tiebreak, target: /scripts/tiebreak.pl }
    volumes:
      - "sidecar-work:/work"
      - "merged-replication:/replication"
      - "overpass-db:/opt/overpass/db:ro"
    environment:
      <<: *regions
      POLL_INTERVAL_MINUTES: "${POLL_INTERVAL_MINUTES:-5}"
      OVERPASS_CLEANUP_KEEP_HOURS: "${OVERPASS_CLEANUP_KEEP_HOURS:-72}"
      SNAPSHOT_KEEP_HOURS: "${SNAPSHOT_KEEP_HOURS:-72}"
      MERGE_LAG_ALERT_MINUTES: "${MERGE_LAG_ALERT_MINUTES:-30}"
    # Replaces the image's own check (the API isn't running here). Fails only
    # on significant degradation; the long start period covers the first
    # bootstrap, which downloads and merges every extract.
    healthcheck:
      test: ["CMD", "bash", "/scripts/health.sh"]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 30m
      start_interval: 30s

  overpass-init:
    image: *overpass-image
    container_name: overpass-init
    restart: "no"
    # service_started, not service_healthy: after a database wipe the sidecar
    # is already running, and a stalled region mustn't block the stack. Init
    # waits for the snapshot marker, and for the merged stream, itself.
    depends_on:
      sidecar:
        condition: service_started
    entrypoint: ["bash", "/scripts/init.sh"]
    # A one-shot: the image's API healthcheck can't pass here.
    healthcheck:
      disable: true
    configs:
      - { source: lib, target: /scripts/lib.sh }
      - { source: init, target: /scripts/init.sh }
    volumes:
      - "overpass-db:/opt/overpass/db"
      - "overpass-diff:/opt/overpass/diff"
      - "sidecar-work:/work:ro"
      - "merged-replication:/replication:ro"
    environment:
      <<: *regions
      OVERPASS_META_MODE: "yes"
      IMPORT_OSM_COMPRESSION_METHOD: gz
      # Millions of elements buffered before flushing during import. Lower =
      # lower peak RAM, slower import; drop to 2 or 1 if 4 gets OOM-killed.
      IMPORT_FLUSH_SIZE: 4

  overpass:
    image: *overpass-image
    container_name: overpass
    restart: unless-stopped
    # On SIGTERM the entrypoint waits for the in-progress diff update to finish;
    # the 10s default would SIGKILL mid-write and risk corrupting the DB.
    stop_grace_period: 120s
    # restart: true makes Compose stop overpass while it recreates overpass-init
    # (e.g. after a region-list change, when init wipes and re-imports the
    # database), and start it again once init has finished.
    depends_on:
      overpass-init:
        condition: service_completed_successfully
        restart: true
    volumes:
      - "overpass-db:/opt/overpass/db"
      - "overpass-diff:/opt/overpass/diff"
      - "merged-replication:/opt/overpass/static/replication:ro"
    expose:
      - "8080"
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      OVERPASS_META_MODE: "yes"
      # The sidecar's merged stream, served by this container's own nginx.
      # The update frequency (60 s) is detected from it at startup.
      OVERPASS_DIFF_URL: "http://localhost:8080/replication/minute"
      OVERPASS_REPLICATE_ID: auto
      OVERPASS_AREAS: "yes"
      OVERPASS_CLEANUP_KEEP_HOURS: "${OVERPASS_CLEANUP_KEEP_HOURS:-72}"
      # Total memory (bytes) the dispatcher lets running queries reserve; each
      # query asks for 512 MiB by default. The entrypoint's default is 768 GiB,
      # which lets heavy queries OOM a small host instead of being refused.
      DISPATCHER_BASE_SPACE: 2147483648
    healthcheck:
      test: "curl -fsS http://localhost:8080/api/status || exit 1"
      interval: 30s
      start_period: 5m
      start_interval: 10s
      retries: 3
