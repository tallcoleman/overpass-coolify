# Overpass API for one OpenStreetMap France extract. Coolify deploys it from
# the public Git repo (Base Directory /single-extract); see README.md.
#
# The one place to set the image. Every service uses it: overpass directly, and
# overpass-init as the base of the image built from Dockerfile (which adds
# scripts/). Override without editing this file by setting OVERPASS_IMAGE (host
# env, .env, or a Coolify environment variable), e.g.
# OVERPASS_IMAGE=b1tw153/overpass-api:0.7.62.11-r22
x-overpass-image: &overpass-image "${OVERPASS_IMAGE:-b1tw153/overpass-api:0.7.62.11-r21}"

# The region: the extract to import and its matching minute replication folder,
# both from OpenStreetMap France. Override with environment variables.
x-extract-url: &extract-url "${IMPORT_OSM_DATA_SOURCE:-https://download.openstreetmap.fr/extracts/north-america/canada/ontario/golden_horseshoe-latest.osm.pbf}"
x-diff-url: &diff-url "${OVERPASS_DIFF_URL:-https://download.openstreetmap.fr/replication/north-america/canada/ontario/golden_horseshoe/minute}"

volumes:
  overpass-db: null
  # Minutely diffs plus fetch_osc.log/.out, kept across redeploys.
  overpass-diff: null
services:
  overpass-init:
    build:
      context: .
      args:
        OVERPASS_IMAGE: *overpass-image
    # The upstream image is amd64-only; without this, a build on an arm64 host
    # (e.g. Apple silicon) looks for an arm64 base and fails.
    platform: linux/amd64
    container_name: overpass-init
    restart: "no"
    # scripts/init.sh, copied into the image by the Dockerfile. It skips an
    # already-initialized database, so it is safe to run on every deploy.
    entrypoint: ["bash", "/scripts/init.sh"]
    volumes:
      - "overpass-db:/opt/overpass/db"
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      OVERPASS_DIFF_DIR: /opt/overpass/diff
      OVERPASS_META_MODE: "yes"
      IMPORT_OSM_DATA_SOURCE: *extract-url
      OVERPASS_DIFF_URL: *diff-url
      IMPORT_OSM_COMPRESSION_METHOD: gz
      # Millions of elements buffered before flushing during import. Lower =
      # lower peak RAM, slower import. update_database's default of 16 gets
      # OOM-killed on a small host; drop to 2 or 1 if 4 still OOMs.
      IMPORT_FLUSH_SIZE: 4

  overpass:
    image: *overpass-image
    container_name: overpass
    # On SIGTERM the entrypoint waits for the in-progress diff update to finish
    # before stopping the dispatchers. Upstream suggests 600s for a planet DB;
    # minutely diffs on this small extract apply in seconds, so 120s is plenty.
    # The 10s default would SIGKILL mid-write and risk corrupting the DB.
    stop_grace_period: 120s
    depends_on:
      overpass-init:
        condition: service_completed_successfully
    volumes:
      - "overpass-db:/opt/overpass/db"
      - "overpass-diff:/opt/overpass/diff"
    expose:
      - "8080"
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      OVERPASS_META_MODE: "yes"
      OVERPASS_DIFF_URL: *diff-url
      OVERPASS_REPLICATE_ID: auto
      OVERPASS_AREAS: "yes"
      # Total memory (bytes) the dispatcher lets running queries reserve; each
      # query asks for 512 MiB by default. The entrypoint's default is 768 GiB,
      # which lets heavy queries OOM a small host instead of being refused.
      # 2 GiB is about 4 default queries at once. The areas dispatcher inherits
      # the same value (DISPATCHER_AREAS_SPACE) as a separate budget.
      DISPATCHER_BASE_SPACE: 2147483648
    healthcheck:
      test: "curl -fsS http://localhost:8080/api/status || exit 1"
      interval: 30s
      start_period: 5m
      start_interval: 10s
      retries: 3
